# Configurations
title:            Gud's Notebook
longtitle:        Gud's Notebook
author:           Gud
email:
description: >
  个人学习、编程、数学建模与项目记录。

version:          1.0
gitbook_version:  3.2.3

# GitHub Pages 地址
url:              'https://gud455.github.io'
baseurl:          ''
rss:              RSS

# 使用 Jekyll Gitbook 远程主题
remote_theme: sighingnow/jekyll-gitbook

# 文章目录设置
toc:
  enabled: true
  h_min:   1
  h_max:   3

# 网站图标
favicon_path:     /assets/gitbook/images/favicon.ico

# Markdown 渲染引擎
markdown:         kramdown

kramdown:
  auto_ids:               true
  input:                  GFM
  math_engine:            mathjax
  smart_quotes:           lsquo,rsquo,ldquo,rdquo
  toc_levels:             1..6
  syntax_highlighter:     rouge
  syntax_highlighter_opts:
    guess_lang:           true

# 代码高亮风格
syntax_highlighter_style: colorful

markdown_ext:             markdown,mkdown,mkdn,mkd,md

# 文章永久链接
permalink:                /:categories/:year-:month-:day-:title:output_ext

# Disqus 评论
# 如果以后使用 Disqus，可以取消注释并填入自己的 shortname
# disqushandler: your-disqus-shortname

exclude:
  - _drafts

# Collections
collections:
  pages:
    output: true
    permalink: /:collection/:path/

  others:
    output: true
    permalink: /:collection/:path/

# 左侧 GitBook 目录中的内容顺序
ordered_collections:
  - posts
  - pages
  - others

# 页面正文宽度
page_width: 800px

# Jekyll 构建配置
destination:      ./_site
incremental:      false
regenerate:       true

# 插件
plugins:
  - jekyll-feed
  - jekyll-readme-index
  - jemoji
