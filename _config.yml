# =========================================================
# Gud's Notebook - Jekyll GitBook Configuration
# =========================================================

# -------------------------
# Site
# -------------------------

lang:              zh-CN

title:             Gud's Notebook
longtitle:         Gud's Notebook

author:            Gud
email:

description: >
  个人学习、编程、数学建模、AI、论文阅读与项目实践记录。

version:           1.0
gitbook_version:   3.2.3


# -------------------------
# GitHub Pages
# -------------------------

url:               'https://gud455.github.io'
baseurl:           ''

rss:               RSS


# -------------------------
# Theme
# -------------------------

remote_theme: sighingnow/jekyll-gitbook


# -------------------------
# Table of Contents
# -------------------------

toc:
  enabled: true
  enabled_index: true
  h_min: 1
  h_max: 3


# -------------------------
# Sidebar Sections
# -------------------------

# -------------------------
# Sidebar Navigation
# -------------------------

navigation_sections:

  - title: 数学建模
    category: modeling

    groups:

      - title: 建模基础
        key: basics

      - title: 数据处理
        key: data

      - title: 评价模型
        key: evaluation

      - title: 预测模型
        key: prediction

      - title: 优化模型
        key: optimization

      - title: 图论
        key: graph


  - title: 编程
    category: programming

    groups:

      - title: Python
        key: python

      - title: C / C++
        key: cpp

      - title: 开发工具
        key: tools


  - title: AI
    category: ai

    groups:

      - title: AI 辅助学习
        key: learning

      - title: AI 编程
        key: coding

      - title: AI + 数学建模
        key: modeling

      - title: AI + 论文阅读
        key: papers


  - title: 论文阅读
    category: papers

    groups:

      - title: 阅读方法
        key: reading

      - title: 论文复现
        key: reproduction


# -------------------------
# Favicon
# -------------------------

favicon_path: assets/gitbook/images/favicon.ico


# -------------------------
# Markdown
# -------------------------

markdown: kramdown

kramdown:

  auto_ids: true

  input: GFM

  math_engine: mathjax

  smart_quotes: lsquo,rsquo,ldquo,rdquo

  toc_levels: 1..6

  syntax_highlighter: rouge

  syntax_highlighter_opts:

    guess_lang: true


syntax_highlighter_style: colorful

markdown_ext: markdown,mkdown,mkdn,mkd,md


# -------------------------
# Posts
# -------------------------

permalink: /logs/:year-:month-:day-:title:output_ext


# -------------------------
# Collections
# -------------------------

collections:

  pages:

    output: true

    sort_by: order

    permalink: /:path/


  others:

    output: true

    sort_by: order

    permalink: /others/:path/


# -------------------------
# Default Front Matter
# -------------------------

defaults:

  # 学习日志
  - scope:

      path: ''

      type: posts

    values:

      layout: post

      author: Gud


  # 知识笔记
  - scope:

      path: ''

      type: pages

    values:

      layout: post

      author: Gud


  # About 等页面
  - scope:

      path: ''

      type: others

    values:

      layout: post

      author: Gud


# -------------------------
# Layout
# -------------------------

page_width: 900px


# -------------------------
# Build
# -------------------------

destination: ./_site

incremental: false

regenerate: true


# -------------------------
# Plugins
# -------------------------

plugins:

  - jekyll-feed

  - jekyll-readme-index

  - jemoji
