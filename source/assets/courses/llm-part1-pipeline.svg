<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">Classification: inference and training</title><desc id="desc">Tokenizer creates IDs and padding mask. The trainable Transformer and task head produce logits. Inference uses Softmax; training compares logits with labels, then backpropagates.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#242522"/></marker></defs><g font-family="Arial, sans-serif"><rect width="760" height="360" fill="white"/><text x="18" y="25" font-size="12" fill="#2f5d50" font-weight="bold" text-anchor="start">01 / ONE FORWARD PASS, TWO USES</text><text x="18" y="60" font-size="12" fill="#686b65" font-weight="normal" text-anchor="start">RAW TEXT</text><text x="18" y="84" font-size="14" fill="#242522" font-weight="normal" text-anchor="start">&quot;A clear explanation.&quot;</text><rect x="18" y="116" width="200" height="76" rx="3" fill="#fafaf7" stroke="#242522"/><text x="32" y="144" font-size="16" fill="#242522" font-weight="bold" text-anchor="start">Tokenizer</text><text x="32" y="169" font-size="12" fill="#686b65" font-weight="normal" text-anchor="start">IDs + mask: [B, L]</text><rect x="274" y="116" width="210" height="76" rx="3" fill="#fafaf7" stroke="#242522"/><text x="288" y="144" font-size="16" fill="#242522" font-weight="bold" text-anchor="start">Transformer</text><text x="288" y="169" font-size="12" fill="#686b65" font-weight="normal" text-anchor="start">Hidden states: [B, L, H]</text><rect x="540" y="116" width="200" height="76" rx="3" fill="#fafaf7" stroke="#242522"/><text x="554" y="144" font-size="16" fill="#242522" font-weight="bold" text-anchor="start">Task head</text><text x="554" y="169" font-size="12" fill="#686b65" font-weight="normal" text-anchor="start">Class logits: [B, C]</text><path d="M110 90 V110" fill="none" stroke="#242522" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M218 153 H266" fill="none" stroke="#242522" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M484 153 H532" fill="none" stroke="#242522" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="254" width="200" height="76" rx="3" fill="#fafaf7" stroke="#242522"/><text x="32" y="282" font-size="16" fill="#242522" font-weight="bold" text-anchor="start">Labels</text><text x="32" y="307" font-size="12" fill="#686b65" font-weight="normal" text-anchor="start">One class per example</text><rect x="274" y="254" width="210" height="76" rx="3" fill="#fafaf7" stroke="#242522"/><text x="288" y="282" font-size="16" fill="#242522" font-weight="bold" text-anchor="start">Cross-entropy loss</text><text x="288" y="307" font-size="12" fill="#686b65" font-weight="normal" text-anchor="start">Training: update weights</text><rect x="540" y="254" width="200" height="76" rx="3" fill="#fafaf7" stroke="#242522"/><text x="554" y="282" font-size="16" fill="#242522" font-weight="bold" text-anchor="start">Softmax</text><text x="554" y="307" font-size="12" fill="#686b65" font-weight="normal" text-anchor="start">Inference: probabilities</text><path d="M640 192 V246" fill="none" stroke="#242522" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M218 292 H266" fill="none" stroke="#242522" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M592 192 V216 H379 V246" fill="none" stroke="#242522" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M484 292 H510 V98 H379 V109" fill="none" stroke="#2f5d50" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M510 98 H640 V109" fill="none" stroke="#2f5d50" stroke-width="1.6" marker-end="url(#arrow)"/><text x="519" y="75" font-size="10" fill="#2f5d50" font-weight="bold" text-anchor="start">BACKPROP</text><text x="18" y="351" font-size="11" fill="#686b65" font-weight="normal" text-anchor="start">B = batch   L = sequence length   H = hidden size   C = number of classes</text></g></svg>