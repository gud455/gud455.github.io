<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-label="Autoregressive probability chain for a binary image"><title>Autoregressive probability chain for a binary image</title><desc>Left: available prefix. Middle: four conditional probabilities for the full target. Right: all sixteen outcomes and their normalized joint probabilities.</desc><rect width="760" height="352" fill="#f6f3eb"/><g font-family="monospace" fill="#22251f"><defs><pattern id="generative-ar-hatch" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M-1 1L1-1M0 7L7 0M6 8L8 6" stroke="#d8d8cc"/></pattern></defs><text x="24" y="28" font-size="13">FOUR BINARY VARIABLES / TARGET 1101</text><text x="24" y="60" font-size="11">PREFIX / STEP 2</text><text x="190" y="60" font-size="11">CONDITIONAL FACTORS</text><text x="440" y="60" font-size="11">ALL 16 OUTCOMES</text><rect x="24" y="84" width="53" height="53" fill="#22251f" stroke="#d8d8cc" stroke-width="1"/><text x="29" y="96" font-size="9" fill="#f6f3eb">x1</text><text x="51" y="121" text-anchor="middle" font-size="20" fill="#f6f3eb">1</text><rect x="80" y="84" width="53" height="53" fill="url(#generative-ar-hatch)" stroke="#b42e20" stroke-width="2"/><text x="85" y="96" font-size="9" fill="#22251f">x2</text><text x="107" y="121" text-anchor="middle" font-size="20" fill="#b42e20">?</text><rect x="24" y="140" width="53" height="53" fill="url(#generative-ar-hatch)" stroke="#d8d8cc" stroke-width="1"/><text x="29" y="152" font-size="9" fill="#22251f">x3</text><text x="51" y="177" text-anchor="middle" font-size="20" fill="#22251f">·</text><rect x="80" y="140" width="53" height="53" fill="url(#generative-ar-hatch)" stroke="#d8d8cc" stroke-width="1"/><text x="85" y="152" font-size="9" fill="#22251f">x4</text><text x="107" y="177" text-anchor="middle" font-size="20" fill="#22251f">·</text><text x="24" y="221" font-size="10">row-major order</text><text x="24" y="242" font-size="10">x1 -> x2 -> x3 -> x4</text><text x="190" y="89"