<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-label="Data parallel gradients with sample-count normalization"><title>Data parallel gradients with sample-count normalization</title><desc>Each logical GPU calculates a local mean gradient. Weighted reduction reproduces the full-batch gradient.</desc><rect width="760" height="375" fill="#f6f3eb"/><g font-family="monospace" fill="#22251f"><text x="24" y="28" font-size="13">DATA PARALLEL / 8 FIXED SAMPLES</text><text x="24" y="50" font-size="11">shared w = 1.000 | local mean loss | BALANCED</text><path d="M324 100H371L422 190H440" stroke="#d8d8cc" fill="none"/><rect x="24" y="72" width="300" height="57" fill="#f6f3eb" stroke="#22251f"/><text x="38" y="93" font-size="12">GPU 1 | n = 4 | alpha = 0.500</text><text x="38" y="115" font-size="12">local mean gradient = -0.500</text><path d="M324 166H371L422 190H440" stroke="#d8d8cc" fill="none"/><rect x="24" y="138" width="300" height="57" fill="#f6f3eb" stroke="#22251f"/><text x="38" y="159" font-size="12">GPU 2 | n = 4 | alpha = 0.500</text><text x="38" y="181" font-size="12">local mean gradient = -4.250</text><rect x="440" y="109" width="290" height="155" fill="#22251f"/><text x="458" y="137" font-size="12" fill="#f6f3eb">SUM(alpha * local gradient)</text><text x="458" y="176" font-size="26" fill="#f6f3eb">-2.37500</text><text x="458" y="207" font-size="11" fill="#f6f3eb">full-batch g = -2.37500</text><text x="458" y="239" font-size="12" fill="#f6f3eb">next w = 1.11875</text><text x="440" y="300" font-size="11" fill="#b42e20">unweighted rank mean: -2.37500</text><text x="24" y="353" font-size="10">A mathematical example. No GPU training or communication is running.</text></g></svg>
