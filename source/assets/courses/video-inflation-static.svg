<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 435" role="img" aria-label="Inflating a 2D kernel along time"><title>Inflating a 2D kernel along time</title><desc>Copy a spatial kernel along time and compare normalized versus unnormalized copies. The output is the sum of per-frame contributions.</desc><rect width="760" height="435" fill="#f6f3eb"/><g font-family="monospace" fill="#22251f"><text x="24" y="28" font-size="13">2D FILTER TO 3D / CONSTANT</text><text x="24" y="56" font-size="11">W2D</text><rect x="24" y="68" width="29" height="29" fill="#f6f3eb" stroke="#d8d8cc"/><text x="39" y="88" text-anchor="middle" font-size="12" fill="#22251f">0</text><rect x="54" y="68" width="29" height="29" fill="#365a68" stroke="#d8d8cc"/><text x="69" y="88" text-anchor="middle" font-size="12" fill="#f6f3eb">-1</text><rect x="84" y="68" width="29" height="29" fill="#f6f3eb" stroke="#d8d8cc"/><text x="99" y="88" text-anchor="middle" font-size="12" fill="#22251f">0</text><rect x="24" y="98" width="29" height="29" fill="#365a68" stroke="#d8d8cc"/><text x="39" y="118" text-anchor="middle" font-size="12" fill="#f6f3eb">-1</text><rect x="54" y="98" width="29" height="29" fill="#b42e20" stroke="#d8d8cc"/><text x="69" y="118" text-anchor="middle" font-size="12" fill="#f6f3eb">4</text><rect x="84" y="98" width="29" height="29" fill="#365a68" stroke="#d8d8cc"/><text x="99" y="118" text-anchor="middle" font-size="12" fill="#f6f3eb">-1</text><rect x="24" y="128" width="29" height="29" fill="#f6f3eb" stroke="#d8d8cc"/><text x="39" y="148" text-anchor="middle" font-size="12" fill="#22251f">0</text><rect x="54" y="128" width="29" height="29" fill="#365a68" stroke="#d8d8cc"/><text x="69" y="148" text-anchor="middle" font-size="12" fill="#f6f3eb">-1</text><rect x="84" y="128" width="29" height="29" fill="#f6f3eb" stroke="#d8d8cc"/><text x="99" y="148" text-anchor="middle" font-size="12" fill="#22251f">0</text><text x="166" y="82" font-size="13">W3D[t] = W2D / Kt</text><text x="166" y="1