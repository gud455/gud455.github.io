<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">MedForge 的输入、输出与两阶段训练</title>
  <desc id="desc">医学图像和问题经过视觉语言模型，生成位置、证据解释与真伪判断。SFT 利用参考输出学习任务，GSPO 对多条候选回答评分并更新模型。参考框和标签属于训练监督，不进入无标注测试输入。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#60716b"/></marker></defs>
  <rect width="900" height="540" fill="#f7f8f6"/>
  <g font-family="system-ui, -apple-system, 'Noto Sans CJK SC', sans-serif" fill="#222b27">
    <text x="32" y="38" font-size="14" fill="#53695f">MEDFORGE / 学习框架</text>
    <text x="32" y="74" font-size="25" font-weight="600">把判断与可检查的视觉证据联系起来</text>
    <rect x="32" y="104" width="220" height="124" rx="6" fill="#fff" stroke="#c9d1cb"/>
    <text x="50" y="137" font-size="17" font-weight="600">图像 + 用户问题</text>
    <text x="50" y="168" font-size="15" fill="#526157">MRI / X 光 / 眼底</text>
    <text x="50" y="196" font-size="15" fill="#526157">待分析的输入</text>
    <path d="M256 166H292" stroke="#60716b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="104" width="236" height="124" rx="6" fill="#e7eee8" stroke="#9fb1a3"/>
    <text x="320" y="137" font-size="17" font-weight="600">视觉语言模型</text>
    <text x="320" y="168" font-size="15" fill="#526157">视觉编码与特征对齐</text>
    <text x="320" y="196" font-size="15" fill="#526157">条件自回归生成</text>
    <path d="M540 166H576" stroke="#60716b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="584" y="104" width="284" height="124" rx="6" fill="#fff" stroke="#c9d1cb"/>
    <text x="604" y="137" font-size="17" font-weight="600">位置 → 解释 → 判断</text>
    <text x="604" y="168" font-size="15" fill="#526157">真实图像采用无伪造约定</text>
    <text x="604" y="196" font-size="15" fill="#526157">三类输出分别评价</text>
    <path d="M418 282V234" stroke="#60716b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M726 282V234" stroke="#60716b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="32" y="288" width="406" height="174" rx="6" fill="#fff" stroke="#c9d1cb"/>
    <text x="52" y="322" font-size="18" font-weight="600">阶段一 / SFT 冷启动</text>
    <text x="52" y="356" font-size="16" fill="#526157">图像、问题 + 示范回答</text>
    <text x="52" y="386" font-size="16" fill="#526157">学习任务、领域表达与输出格式</text>
    <text x="52" y="427" font-size="15" fill="#53695f">LoRA：参数更新方式</text>
    <rect x="460" y="288" width="408" height="174" rx="6" fill="#fff" stroke="#c9d1cb"/>
    <text x="480" y="322" font-size="18" font-weight="600">阶段二 / Forgery-aware GSPO</text>
    <text x="480" y="356" font-size="16" fill="#526157">同一输入生成一组候选回答</text>
    <text x="480" y="386" font-size="16" fill="#526157">按格式、分类和覆盖等奖励比较</text>
    <text x="480" y="427" font-size="15" fill="#53695f">序列级比率与策略更新</text>
    <text x="32" y="500" font-size="15" fill="#526157">监督信息：真实标签、编辑区域与参考解释；测试按无标注推理协议构造输入。</text>
    <text x="32" y="525" font-size="13" fill="#758078">依据原论文与公开实现重新整理，2026.10 · 学习示意</text>
  </g>
</svg>
