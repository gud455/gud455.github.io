<section class="course-lab" data-convolution-lab aria-label="卷积窗口与逐项计算实验">
<div class="lab-register"><span>INTERACTIVE / 07</span><span>单通道 6×6 合成输入 · 固定 3×3 核</span></div>
<div data-convolution-controls hidden><div class="lab-controls"><label>输入图案<select data-conv-pattern><option value="edge">竖直边缘</option><option value="horizontal">水平边缘</option><option value="checker">棋盘格</option></select></label><label>卷积核<select data-conv-kernel><option value="sobel">Sobel x 边缘核</option><option value="blur">3×3 均值核</option><option value="sharpen">锐化核</option><option value="identity">中心取值核</option></select></label></div><div class="lab-controls"><label>步长 S<select data-conv-stride><option value="1">1</option><option value="2">2</option></select></label><label>补零 P<select data-conv-padding><option value="1">1</option><option value="0">0</option></select></label><label>偏置 b <output data-conv-bias-output>0</output><input type="range" min="-2" max="2" step="0.5" value="0" data-conv-bias></label><button type="button" data-conv-reset>重置 ↺</button></div><div class="conv-matrices"><div><h3>输入与补零</h3><div class="conv-grid" data-input-grid aria-label="当前输入与选中窗口"></div><p>红框格子：当前窗口；斜纹格子：补零。</p></div><div><h3>输出特征图</h3><div class="conv-grid conv-output-grid" data-output-grid role="group" aria-label="选择卷积输出位置"></div><p>点击输出位置；聚焦网格后也可用方向键移动。</p></div></div><div class="lab-controls"><label>查看输出位置 <output data-conv-position-output></output><input type="range" min="0" max="35" step="1" value="14" data-conv-position></label></div></div>
<figure class="course-svg-plot" data-conv-static><img src="{{ '/assets/courses/convolution-static.svg' | relative_url }}" alt="竖直边缘合成图经 Sobel x 核计算，默认补零1、步长1，展示第3行第3列输出的窗口"><figcaption>静态示意保留默认输入与输出。启用 JavaScript 后可选择位置与卷积设置。</figcaption></figure>
<p class="lab-result" data-conv-result role="status">默认输出尺寸为 6×6。单通道演示，尚未应用激活函数。</p>
<details class="lab-detail"><summary>展开 / 当前窗口的逐项计算</summary><div class="optimizer-table-wrap"><table class="optimizer-table"><caption>每一项：输入值 × 核权重 = 乘积</caption><tbody data-conv-products><tr><td>启用交互后显示当前 3×3 窗口。</td></tr></tbody></table></div><p data-conv-sum>输出为九个乘积之和，再加偏置。</p></details>
<p class="conv-caption">输入数值范围 0–4；输出红色表示正响应，蓝色表示负响应，颜色按当前图的最大绝对响应归一化。显示数字保留三位小数，计算使用完整精度。</p>
</section>
